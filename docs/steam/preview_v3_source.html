</style></head><body><div class="bg"></div><canvas id="map" width="1280" height="720" style="position:absolute;left:0;top:0"></canvas>
<script>
const c=document.getElementById('map').getContext('2d');
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const cols=['#3cf06a','#38c9e8','#e8b038','#c060ff','#ff5a6a'];
const hubs=[];
// district centers
const dc=[[200,190,0],[430,420,1],[760,150,2],[1050,300,3],[900,560,4],[300,600,1],[640,380,0],[1130,120,2],[120,420,3],[560,90,4]];
dc.forEach(([x,y,k],i)=>{const n=4+Math.floor(rnd()*3);for(let j=0;j<n;j++){const a=rnd()*6.28,r=30+rnd()*95;hubs.push({x:x+Math.cos(a)*r*1.4,y:y+Math.sin(a)*r,k:i%5,d:i})}});
c.lineWidth=2;
for(let i=0;i<hubs.length;i++){const a=hubs[i];
 const near=hubs.map((b,j)=>({j,d:Math.hypot(a.x-b.x,a.y-b.y)})).filter(o=>o.j!==i).sort((p,q)=>p.d-q.d).slice(0,3);
 near.forEach(o=>{const b=hubs[o.j];c.strokeStyle=cols[a.k]+"aa";c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()})}
hubs.forEach(h=>{const r=7+rnd()*7;c.fillStyle=cols[h.k]+"44";c.strokeStyle=cols[h.k]+'cc';c.lineWidth=2.5;c.beginPath();c.arc(h.x,h.y,r,0,6.28);c.fill();c.stroke();
 for(let k=0;k<3;k++){const a=rnd()*6.28;c.fillStyle=cols[h.k]+'88';c.beginPath();c.arc(h.x+Math.cos(a)*(r+12),h.y+Math.sin(a)*(r+12),3,0,6.28);c.fill()}});
</script>
